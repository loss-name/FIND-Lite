[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "find-lite"
version = "0.1.0"
description = "A compact two-point random line-search optimizer for continuous box-constrained black-box objectives."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["find_lite", "benchmarks", "baselines"]
